<div class="min-h-screen bg-[#F8F2E6] dark:bg-[#1F1A0F] text-[#3E2A1E] dark:text-[#EBE4E0] py-10 sm:py-16 px-4 sm:px-6 flex items-center justify-center">
  <div class="max-w-xl w-full bg-[#F2E9D8] dark:bg-[#221D12] p-6 sm:p-8 rounded-2xl shadow-md border border-[#E2D3B8] dark:border-[#4F4534]">
    <h1 class="text-2xl sm:text-3xl font-extrabold text-[#3E2A1E] dark:text-[#EBE4E0] mb-2 text-center">Get in Touch</h1>
    <p class="text-[#5C4433] dark:text-[#EAE5E1] text-center mb-6 sm:mb-8 text-sm">Have questions or need assistance? Drop us a message below.</p>
    <div *ngIf="submitted" class="bg-[#EDF1E1] dark:bg-[#1A1C12] border border-[#C7D1AE] dark:border-[#535A44] text-[#4B5F3A] dark:text-[#E0E5DC] p-4 rounded-xl text-center mb-6 text-sm">Thank you! Your message has been sent successfully. We will get back to you soon.</div>
    <form *ngIf="!submitted" class="space-y-5 sm:space-y-6" (submit)="onSubmit()">
      <div>
        <label class="block text-sm font-medium text-[#4A3627] dark:text-[#EAE5E1] mb-1">Your Name</label>
        <input type="text" [(ngModel)]="name" name="name" required class="w-full px-3 py-2.5 border border-[#DCC9A8] dark:border-[#5D513C] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#6C7154] dark:focus:ring-[#CDCFC6] text-sm bg-[#F2E9D8] dark:bg-[#221D12]" placeholder="Jane Doe" />
      </div>
      <div>
        <label class="block text-sm font-medium text-[#4A3627] dark:text-[#EAE5E1] mb-1">Email Address</label>
        <input type="email" [(ngModel)]="email" name="email" required class="w-full px-3 py-2.5 border border-[#DCC9A8] dark:border-[#5D513C] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#6C7154] dark:focus:ring-[#CDCFC6] text-sm bg-[#F2E9D8] dark:bg-[#221D12]" placeholder="jane@example.com" />
      </div>
      <div>
        <label class="block text-sm font-medium text-[#4A3627] dark:text-[#EAE5E1] mb-1">Message</label>
        <textarea [(ngModel)]="message" name="message" rows="4" required class="w-full px-3 py-2.5 border border-[#DCC9A8] dark:border-[#5D513C] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#6C7154] dark:focus:ring-[#CDCFC6] text-sm bg-[#F2E9D8] dark:bg-[#221D12]" placeholder="How can we help you?"></textarea>
      </div>
      <button type="submit" class="w-full py-3 sm:py-2.5 px-4 bg-[#6C7154] text-white font-medium rounded-lg hover:bg-[#5B6048] active:scale-[0.98] transition shadow">Send Message</button>
    </form>
  </div>
</div>

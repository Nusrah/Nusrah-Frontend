    </div>
        <div *ngFor="let col of [
      { t: 'Join Our Team', l: [['/campaigns', 'Campaigns'], ['/about', 'About Us'], ['/join-team', 'Join Our Team'], ['/careers', 'Careers'], ['/work-with-us', 'Work With Us'], ['/contact', 'Contact']] },

      <ul class="space-y-3 text-sm text-[#C9B79E] dark:text-[#DCC9AE]">
        <li *ngFor="let l of col.l"><a [routerLink]="l[0]" class="hover:text-[#B5601F] dark:hover:text-[#DF8642] transition-all duration-300 ease-out hover:-translate-y-0.5 inline-block">{{ l[1] }}</a></li>
      </ul>
    </div>
    <div class="space-y-4">
      <h3 class="text-[#E8B77C] dark:text-[#F0C48A] font-semibold text-sm tracking-wide">Contact Us</h3>
      <ul class="space-y-3 text-sm text-[#C9B79E] dark:text-[#DCC9AE]">
        <li *ngFor="let c of [['tel:+919876543210', '📞', '+91 98765 43210'], ['mailto:nusrah.support@gmail.com', '✉️', 'nusrah.support@gmail.com'], ['https://wa.me/919876543210', '💬', 'WhatsApp Support']]">

        </li>
      </ul>
    </div>
  </div>

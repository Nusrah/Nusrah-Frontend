<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nusrah</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Nusrah - Aid that anchors you to Jannah">
  <link rel="icon" type="image/png" href="/nusrah-logo.png">

  <!-- Fonts matched to the Nusrah logo: Cormorant Garamond (headings) + Jost (body & tagline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Razorpay Checkout SDK Script -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <!-- Apply saved theme immediately, before Angular renders, to avoid a flash of the wrong theme -->
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('nusrah-theme');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>

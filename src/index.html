<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nusrah</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Nusrah - Aid that anchors you to Jannah">
  <meta name="theme-color" content="#F8F2E6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1F1A0F" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/png" href="/nusrah-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <!-- applies the saved theme before Angular renders, so there is no flash of the wrong theme -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('nusrah-theme') === 'dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
